name: Build Sabi Ko v1.9 Test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify updated v1.9 Android files
        run: |
          test -f app/build.gradle
          test -f app/src/main/assets/index.html
          grep -q "versionName '1.9-test'" app/build.gradle
          grep -q 'class="board-scroll"' app/src/main/assets/index.html
          grep -q 'speakSpeed' app/src/main/java/ph/sabiko/app/MainActivity.java
      - name: Build Android debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify generated APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sabi-Ko-v1.9-test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
